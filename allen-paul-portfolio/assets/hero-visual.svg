<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="560" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101D32"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="isoTop" x1="160" y1="130" x2="400" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C3357"/>
      <stop offset="100%" stop-color="#12223C"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#438DFF"/>
      <stop offset="100%" stop-color="#54D6E8"/>
    </linearGradient>
    <pattern id="gridPattern" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#438DFF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Canvas & Architectural Grid -->
  <rect width="560" height="460" fill="url(#bgGrad)"/>
  <rect width="560" height="460" fill="url(#gridPattern)"/>

  <!-- Isometric Base Platform (Layer 0: Infrastructure) -->
  <g transform="translate(0, 22)">
    <polygon points="280,235 455,315 280,395 105,315" fill="#0F1B2E" stroke="#438DFF" stroke-opacity="0.35" stroke-width="1.5"/>
    <polygon points="105,315 280,395 280,411 105,331" fill="#0A1322"/>
    <polygon points="455,315 280,395 280,411 455,331" fill="#13233E"/>
  </g>

  <!-- Isometric Mid Plane (Layer 1: Application & API Bus) -->
  <g transform="translate(0, -18)">
    <polygon points="280,185 435,255 280,325 125,255" fill="url(#isoTop)" stroke="#54D6E8" stroke-opacity="0.45" stroke-width="1.5"/>
    <polygon points="125,255 280,325 280,337 125,267" fill="#0E1A2D"/>
    <polygon points="435,255 280,325 280,337 435,267" fill="#172A48"/>

    <!-- Data Routing Lines -->
    <path d="M210 255L280 223L350 255L280 287Z" stroke="#54D6E8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="280" cy="223" r="5" fill="#54D6E8"/>
    <circle cx="350" cy="255" r="5" fill="#438DFF"/>
    <circle cx="280" cy="287" r="5" fill="#54D6E8"/>
    <circle cx="210" cy="255" r="5" fill="#438DFF"/>
  </g>

  <!-- Isometric Database Cylinder (Left Node) -->
  <g transform="translate(132, 148)">
    <ellipse cx="42" cy="58" rx="36" ry="14" fill="#0D192B" stroke="#438DFF" stroke-width="1.5"/>
    <path d="M6 22V58C6 65.7 22.1 72 42 72C61.9 72 78 65.7 78 58V22" fill="#132542" stroke="#438DFF" stroke-width="1.5"/>
    <path d="M6 40C6 47.7 22.1 54 42 54C61.9 54 78 47.7 78 40" stroke="#54D6E8" stroke-opacity="0.55" stroke-width="1.3"/>
    <ellipse cx="42" cy="22" rx="36" ry="14" fill="#1C355C" stroke="#54D6E8" stroke-width="1.6"/>
  </g>

  <!-- Elevated Code & System Window (Center-Top) -->
  <g transform="translate(215, 76)">
    <rect x="0" y="0" width="215" height="126" rx="12" fill="#0F1C31" stroke="#438DFF" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="0" y="0" width="215" height="26" rx="12" fill="#162846"/>
    <circle cx="16" cy="13" r="3.5" fill="#F87171"/>
    <circle cx="28" cy="13" r="3.5" fill="#FBBF24"/>
    <circle cx="40" cy="13" r="3.5" fill="#34D399"/>
    <rect x="62" y="10" width="76" height="6" rx="3" fill="#8994A5" fill-opacity="0.45"/>

    <!-- Abstract Code Blocks -->
    <rect x="18" y="40" width="68" height="7" rx="3.5" fill="#54D6E8"/>
    <rect x="94" y="40" width="44" height="7" rx="3.5" fill="#438DFF" fill-opacity="0.7"/>
    <rect x="30" y="56" width="118" height="7" rx="3.5" fill="#F4F5F7" fill-opacity="0.75"/>
    <rect x="30" y="72" width="92" height="7" rx="3.5" fill="#8994A5" fill-opacity="0.55"/>
    <rect x="30" y="88" width="134" height="7" rx="3.5" fill="#438DFF"/>
    <rect x="18" y="104" width="54" height="7" rx="3.5" fill="#54D6E8" fill-opacity="0.8"/>
  </g>

  <!-- Connector Beams -->
  <path d="M174 148V118H215" stroke="#54D6E8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M350 202V236" stroke="#438DFF" stroke-width="1.5"/>
</svg>
